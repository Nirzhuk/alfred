# Build Alfred desktop installers and publish them on a public GitHub Release.
#
# Alfred is free and open source under GPL-3.0-or-later. Official
# maintainer-built binaries are distributed as public GitHub Release assets:
#   - macOS: .dmg for Apple Silicon and Intel (Developer ID signed,
#     notarized, stapled)
#   - Windows: .exe (NSIS) and .msi — unsigned beta; SmartScreen warns
#   - Linux: .AppImage, .deb, .rpm
#
# Flow:
#   1. Pushing a tag `vX.Y.Z` (or a manual dispatch) builds every platform.
#   2. Artifacts land on a DRAFT release first. Gates download the exact
#      staged DMGs/EXE and exercise clean install, two launches, uninstall,
#      signing, and notarization on native hosted runners.
#   3. The publish-release job attaches SHA256SUMS.txt, uploads the
#      acceptance manifest artifact, and only then flips the draft public.
#
# Gates:
#   - verify-version rejects version mismatch across package.json,
#     src-tauri/Cargo.toml, and src-tauri/tauri.conf.json, and rejects a
#     pushed tag that does not equal `v<version>`.
#   - verify-*-installers fail the run before publication if an installer
#     cannot be installed, launched twice, and (Windows) uninstalled.
#
# There is no automatic updater. `uploadUpdaterJson` stays false and no
# updater plugin, key, or manifest exists. Users update manually via
# Help -> Download Latest Version..., which opens this repository's
# releases page.
#
# Signing: macOS Developer ID signing and notarization are required. Windows
# Authenticode signing is explicitly waived, so every Windows artifact is an
# unsigned beta.
#
# Repo settings required: Settings -> Actions -> General -> Workflow
# permissions -> Read and write permissions.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-version:
    name: Verify version alignment
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require one version across all three release files
        id: versions
        run: |
          set -euo pipefail
          package_version=$(jq -er '.version' package.json)
          tauri_version=$(jq -er '.version' src-tauri/tauri.conf.json)
          cargo_version=$(awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"|".*/, "")
              print
              exit
            }
          ' src-tauri/Cargo.toml)

          echo "package.json             $package_version"
          echo "src-tauri/Cargo.toml     $cargo_version"
          echo "src-tauri/tauri.conf.json $tauri_version"

          if [ -z "$cargo_version" ]; then
            echo "::error::Could not read [package] version from src-tauri/Cargo.toml"
            exit 1
          fi
          if [ "$package_version" != "$cargo_version" ] || [ "$package_version" != "$tauri_version" ]; then
            echo "::error::Release version mismatch. All three files must agree before a release build."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [ "$tag" != "v$package_version" ]; then
              echo "::error::Pushed tag $tag does not match the release version v$package_version. Tag the commit again or fix the versions."
              exit 1
            fi
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Build ${{ matrix.name }}
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS Apple Silicon
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            name: macOS Intel
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            name: Linux
            args: ""
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: windows-latest
            name: Windows
            args: ""
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (Tauri action helper)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Prepare and verify exact managed runtime inputs
        shell: bash
        env:
          ALFRED_RUNTIME_CACHE: ${{ runner.temp }}/alfred-managed-runtime-cache
          ALFRED_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/alfred-managed-runtime-evidence
          ALFRED_RUNTIME_PUBLISHER_VERIFY: ${{ vars.ALFRED_RUNTIME_PUBLISHER_VERIFY }}
          ALFRED_CODEX_SIDECAR_EXECUTABLE: ${{ vars.ALFRED_CODEX_SIDECAR_EXECUTABLE }}
          ALFRED_CODEX_LEGAL_DIR: ${{ vars.ALFRED_CODEX_LEGAL_DIR }}
          ALFRED_CODEX_TARGET_SBOM: ${{ vars.ALFRED_CODEX_TARGET_SBOM }}
        run: |
          set -euo pipefail
          # Source validation is offline and proves the release cannot drift to
          # latest/fallback semantics before any artifact is fetched.
          bun run verify:managed-runtimes -- --sources-only
          # ponytail: no bundled runtimes until the release inputs exist; the
          # app then ships like a source build. Set the four vars to re-enable.
          if [ -z "${ALFRED_CODEX_SIDECAR_EXECUTABLE}${ALFRED_CODEX_LEGAL_DIR}${ALFRED_CODEX_TARGET_SBOM}${ALFRED_RUNTIME_PUBLISHER_VERIFY}" ]; then
            echo "::warning::Managed runtime inputs unset; shipping without bundled runtimes."
            exit 0
          fi
          # Strict preparation requires every exact artifact, legal input,
          # publisher signature/attestation, and a target Codex sidecar. The
          # release is intentionally blocked when any one is absent.
          bun run prepare:managed-runtimes -- \
            --target "${{ matrix.target }}" \
            --release \
            --codex-sidecar "${ALFRED_CODEX_SIDECAR_EXECUTABLE:?set the target Codex sidecar executable}" \
            --codex-legal-dir "${ALFRED_CODEX_LEGAL_DIR:?set the Codex legal inventory directory}" \
            --codex-sbom "${ALFRED_CODEX_TARGET_SBOM:?set the final target Codex SBOM}" \
            --output src-tauri/sidecars/managed-runtimes
          test -n "${ALFRED_RUNTIME_PUBLISHER_VERIFY:?set the reviewed offline publisher verifier}"
          bun run verify:managed-runtimes -- \
            --target "${{ matrix.target }}" \
            --root src-tauri/sidecars/managed-runtimes \
            --offline

      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for required in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!required:-}" ]; then
              echo "$required secret is required for signed macOS releases"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          trap 'rm -f certificate.p12' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          if [ -z "$CERT_ID" ]; then
            echo "Could not find a Developer ID Application identity after import"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Build and stage on a draft GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required macOS code signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Public Polar commerce configuration, baked into the binaries at
          # compile time (build.rs / Vite). Repository VARIABLES, not secrets —
          # every value here is public by design. Leave any of them unset and
          # the build ships unconfigured: perks never gate, the in-app
          # download action falls back to source-build instructions.
          ALFRED_POLAR_ENVIRONMENT: ${{ vars.ALFRED_POLAR_ENVIRONMENT }}
          ALFRED_POLAR_ORGANIZATION_ID: ${{ vars.ALFRED_POLAR_ORGANIZATION_ID }}
          ALFRED_POLAR_INDIVIDUAL_BENEFIT_ID: ${{ vars.ALFRED_POLAR_INDIVIDUAL_BENEFIT_ID }}
          ALFRED_POLAR_TEAMS_BENEFIT_ID: ${{ vars.ALFRED_POLAR_TEAMS_BENEFIT_ID }}
          VITE_POLAR_DESKTOP_CHECKOUT_URL: ${{ vars.VITE_POLAR_DESKTOP_CHECKOUT_URL }}
          VITE_POLAR_CUSTOMER_PORTAL_URL: ${{ vars.VITE_POLAR_CUSTOMER_PORTAL_URL }}
        with:
          tagName: v__VERSION__
          releaseName: Alfred v__VERSION__
          releaseBody: |
            Official Alfred builds for v__VERSION__. Free for everyone under GPL-3.0-or-later; the exact source for these binaries is the `v__VERSION__` tag in this repository.

            **macOS:** `.dmg` disk images for Apple Silicon and Intel. Developer ID signed, notarized, and stapled — Gatekeeper opens them without warnings.

            **Windows:** `.exe` (NSIS) installer and `.msi`. These are **unsigned beta** builds: Windows reports an unknown publisher and SmartScreen may warn before running. Verify the SHA-256 checksum against `SHA256SUMS.txt` before continuing.

            **Linux:** `.AppImage`, `.deb`, and `.rpm`.

            Alfred shells out to local agent CLIs (Claude Code, Cursor, Codex, OpenCode, GitHub Copilot, Gemini CLI, Grok Build). Install and authenticate those on the machine before running workflows.

            Updates are manual: **Help -> Download Latest Version...** inside Alfred opens this releases page. Alfred never installs updates by itself.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }} --bundles ${{ matrix.bundles }}

      - name: Notarize, staple, and replace macOS DMG
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}"
            exit 1
          fi

          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"
          xcrun stapler validate "${dmgs[0]}"

          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          gh release upload "v${version}" "${dmgs[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  verify-macos-installers:
    name: Verify downloaded macOS installer (${{ matrix.arch }})
    needs: publish-tauri
    permissions:
      # The release is still a draft here; reading draft assets needs
      # push-level access.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            expected_arch: arm64
          - platform: macos-15-intel
            arch: x64
            expected_arch: x86_64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download exact draft DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          asset_name="Alfred_${version}_${{ matrix.arch }}.dmg"
          release_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v${version}\") | .id" | head -1)
          if [ -z "$release_id" ]; then
            echo "Draft release v${version} was not found"
            exit 1
          fi

          asset_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq ".[] | select(.name == \"$asset_name\") | .id" | head -1)
          if [ -z "$asset_id" ]; then
            echo "Draft asset $asset_name was not found"
            exit 1
          fi

          dmg_path="$release_dir/$asset_name"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Verify, install, and launch twice
        run: |
          hdiutil verify "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          mount_point="$RUNNER_TEMP/alfred-mount"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$DMG_PATH"

          codesign --verify --deep --strict --verbose=2 "$mount_point/Alfred.app"
          spctl --assess --type execute --verbose=4 "$mount_point/Alfred.app"

          actual_arch=$(lipo -archs "$mount_point/Alfred.app/Contents/MacOS/alfred")
          if [ "$actual_arch" != "${{ matrix.expected_arch }}" ]; then
            echo "Expected ${{ matrix.expected_arch }}, found $actual_arch"
            exit 1
          fi

          ditto "$mount_point/Alfred.app" /Applications/Alfred.app
          codesign --verify --deep --strict --verbose=2 /Applications/Alfred.app
          spctl --assess --type execute --verbose=4 /Applications/Alfred.app

          launch_and_quit() {
            open -n /Applications/Alfred.app
            for _ in {1..20}; do
              if [ "$(osascript -e 'application id "com.nirzhuk.alfred" is running')" = "true" ]; then
                osascript -e 'tell application id "com.nirzhuk.alfred" to quit'
                return 0
              fi
              sleep 1
            done
            echo "Alfred did not launch within 20 seconds"
            return 1
          }

          launch_and_quit
          launch_and_quit

      - name: Uninstall and detach test DMG
        if: always()
        run: |
          osascript -e 'tell application id "com.nirzhuk.alfred" to quit' 2>/dev/null || true
          rm -rf /Applications/Alfred.app
          hdiutil detach "$RUNNER_TEMP/alfred-mount" 2>/dev/null || true

  verify-windows-installer:
    name: Verify downloaded unsigned Windows installer
    needs: publish-tauri
    permissions:
      # The release is still a draft here; reading draft assets needs
      # push-level access.
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download, install, and launch twice
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $releaseDir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $installerName = "Alfred_${version}_x64-setup.exe"
          $installer = Join-Path $releaseDir $installerName

          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list GitHub Releases"
          }
          $release = $releases |
            Where-Object { $_.draft -and $_.tag_name -eq "v${version}" } |
            Select-Object -First 1
          if (-not $release) {
            throw "Draft release v${version} was not found"
          }

          $asset = $release.assets |
            Where-Object { $_.name -eq $installerName } |
            Select-Object -First 1
          if (-not $asset) {
            throw "Draft asset $installerName was not found"
          }

          Invoke-WebRequest `
            -Uri $asset.url `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -OutFile $installer

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected the waived Windows beta to be unsigned, found $($signature.Status)"
          }

          $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with $($install.ExitCode)"
          }

          $executable = Join-Path $env:LOCALAPPDATA 'Alfred\alfred.exe'
          if (-not (Test-Path $executable)) {
            throw "Installed executable not found at $executable"
          }

          function Test-AlfredLaunch {
            $process = Start-Process -FilePath $executable -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Alfred exited during launch with code $($process.ExitCode)"
            }
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
          }

          Test-AlfredLaunch
          Test-AlfredLaunch

          $uninstaller = Join-Path (Split-Path $executable) 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller not found at $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with $($uninstall.ExitCode)"
          }
          if (Test-Path $executable) {
            throw "Alfred executable remains after uninstall"
          }

  publish-release:
    name: Attach checksums and publish the release
    needs:
      - verify-version
      - publish-tauri
      - verify-macos-installers
      - verify-windows-installer
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      # Required artifacts gate publication: the release never goes public
      # without exactly one copy of each advertised installer. Linux packages
      # and the Windows .msi are recorded but not required.
      - name: Download and hash the staged artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/acceptance"
          mkdir -p "$work"

          release_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v${VERSION}\") | .id" | head -1)
          if [ -z "$release_id" ]; then
            echo "::error::Draft release v${VERSION} was not found"
            exit 1
          fi

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | {name, id, size}' | jq -s '.' > "$work/assets.json"

          # filename|platform|architecture|signing
          required="Alfred_${VERSION}_aarch64.dmg|macos|arm64|developer-id-signed-notarized-stapled
          Alfred_${VERSION}_x64.dmg|macos|x86_64|developer-id-signed-notarized-stapled
          Alfred_${VERSION}_x64-setup.exe|windows|x86_64|unsigned-beta"

          : > "$work/sha256sums.txt"
          : > "$work/required.jsonl"
          failed=0
          while IFS='|' read -r name platform arch signing; do
            name=$(echo "$name" | xargs)
            [ -z "$name" ] && continue

            matches=$(jq --arg n "$name" '[.[] | select(.name == $n)] | length' "$work/assets.json")
            if [ "$matches" -eq 0 ]; then
              echo "::error::Required artifact $name is missing from draft release v${VERSION}"
              failed=1
              continue
            fi
            if [ "$matches" -gt 1 ]; then
              echo "::error::Required artifact $name appears $matches times in draft release v${VERSION}"
              failed=1
              continue
            fi

            asset_id=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .id' "$work/assets.json")
            path="$work/$name"
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$path"

            size=$(stat -c '%s' "$path")
            recorded_size=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .size' "$work/assets.json")
            if [ "$size" != "$recorded_size" ]; then
              echo "::error::$name downloaded as $size bytes but the draft records $recorded_size"
              failed=1
              continue
            fi

            checksum=$(sha256sum "$path" | cut -d' ' -f1)
            echo "$checksum  $name" >> "$work/sha256sums.txt"
            jq -nc \
              --arg filename "$name" \
              --arg platform "$platform" \
              --arg architecture "$arch" \
              --arg signing "$signing" \
              --argjson sizeBytes "$size" \
              --arg sha256 "$checksum" \
              '{filename: $filename, platform: $platform, architecture: $architecture, signing: $signing, sizeBytes: $sizeBytes, sha256: $sha256}' \
              >> "$work/required.jsonl"
          done <<< "$required"

          if [ "$failed" -ne 0 ]; then
            echo "::error::The draft release does not contain exactly one copy of every required artifact"
            exit 1
          fi

          jq -s '.' "$work/required.jsonl" > "$work/required.json"

          jq --slurpfile req "$work/required.json" \
            '[.[] | select(.name as $n | ($req[0] | map(.filename) | index($n)) | not)
                  | {filename: .name, sizeBytes: .size}]' \
            "$work/assets.json" > "$work/best-effort.json"

          echo "WORK_DIR=$work" >> "$GITHUB_ENV"

      - name: Write the acceptance manifest
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/manifest"
          mkdir -p "$out"

          jq -n \
            --arg version "$VERSION" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg sourceRef "$GITHUB_REF" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile req "$WORK_DIR/required.json" \
            --slurpfile bestEffortArtifacts "$WORK_DIR/best-effort.json" \
            '{
              schemaVersion: 2,
              kind: "alfred-release-acceptance-manifest",
              version: $version,
              sourceCommit: $sourceCommit,
              sourceRef: $sourceRef,
              generatedAt: $generatedAt,
              workflowRun: $workflowRun,
              distribution: "public-github-releases",
              automaticUpdates: false,
              uploadUpdaterJson: false,
              requiredArtifacts: $req[0],
              bestEffortArtifacts: $bestEffortArtifacts[0]
            }' > "$out/acceptance-manifest.json"

          {
            echo "Alfred v$VERSION release acceptance manifest"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Source ref:    $GITHUB_REF"
            echo "Generated at:  $(jq -r '.generatedAt' "$out/acceptance-manifest.json")"
            echo "Workflow run:  $(jq -r '.workflowRun' "$out/acceptance-manifest.json")"
            echo "Distribution:  public GitHub Release v$VERSION"
            echo
            echo "Required artifacts"
            echo "------------------"
            jq -r '.requiredArtifacts[]
                   | "  \(.filename)\n    platform:     \(.platform)\n    architecture: \(.architecture)\n    signing:      \(.signing)\n    size:         \(.sizeBytes) bytes\n    sha256:       \(.sha256)\n"' \
              "$out/acceptance-manifest.json"
            echo "Best-effort artifacts"
            echo "---------------------"
            jq -r 'if (.bestEffortArtifacts | length) == 0
                   then "  none"
                   else (.bestEffortArtifacts[] | "  \(.filename) — \(.sizeBytes) bytes")
                   end' \
              "$out/acceptance-manifest.json"
            echo
            echo "SHA-256 checksums"
            echo "-----------------"
            cat "$WORK_DIR/sha256sums.txt"
          } > "$out/acceptance-manifest.txt"

          cat "$out/acceptance-manifest.txt"
          cat "$out/acceptance-manifest.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "MANIFEST_DIR=$out" >> "$GITHUB_ENV"

      - name: Upload the acceptance manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-manifest
          path: ${{ env.MANIFEST_DIR }}
          if-no-files-found: error

      - name: Attach SHA256SUMS.txt to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" "$WORK_DIR/sha256sums.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/v${VERSION}"
