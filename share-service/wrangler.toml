name = "alfred-workflow-share"
main = "src/index.ts"
compatibility_date = "2026-09-08"

[vars]
# Operators must provide a trusted HTTPS origin and explicitly enable writes
# with `wrangler secret/vars`. Keeping the checked-in defaults read-only avoids
# publishing from an unconfigured source checkout.
SHARE_ORIGIN = "https://alfred.nirzhuk.dev"
PUBLISHING_ENABLED = "false"
SUPPORT_URL = "https://github.com/Nirzhuk/alfred/issues"
DOWNLOAD_URL = "https://github.com/Nirzhuk/alfred/releases/latest"
# Set these per environment; production also requires a distributed
# RATE_LIMITER binding (the Worker fails closed without it).
# MAX_PUBLICATIONS = "10000"
# MAX_STORAGE_BYTES = "2621440000"
# MAX_RETAINED_RECORDS = "100000"

# Cloudflare's distributed limiter is required for production. Replace the
# example namespace with a positive integer owned by the deployment account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 120
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "alfred-workflow-share"
database_id = ""
migrations_dir = "migrations"
